[project]
name = "matrix-display"
version = "0.1.0"
description = "Home status display for a 64x64 RGB LED matrix (date, weather scene, Home Assistant)"
requires-python = ">=3.11"
dependencies = ["pillow"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
matrix-display = "matrix_display.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
